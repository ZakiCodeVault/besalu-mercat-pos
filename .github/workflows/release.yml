name: Release

# Se dispara al empujar un tag de version, p. ej.  v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y publicar el instalador
        env:
          # Token automatico del repo (permite crear el Release).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de codigo (opcional): cuando agregues estos secrets, firma solo.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist -- --publish always
